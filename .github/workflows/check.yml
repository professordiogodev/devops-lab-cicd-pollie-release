name: Lab check

on:
  push:
  workflow_dispatch:
  # re-check when your CI workflow finishes, so the check sees the final result
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Run the lab check
        run: bash .lab/check.sh
