<text x="48" y="185" font-size="15" fill="#e2e8f0" opacity=".92" font-family="Segoe UI,Helvetica,Arial,sans-serif">Merging to main is not releasing. Tag v1.2.3 and the pipeline must</text>
<text x="48" y="207" font-size="15" fill="#e2e8f0" opacity=".92" font-family="Segoe UI,Helvetica,Arial,sans-serif">test, build, scan and publish a versioned image, attach a software</text>
<text x="48" y="229" font-size="15" fill="#e2e8f0" opacity=".92" font-family="Segoe UI,Helvetica,Arial,sans-serif">bill of materials to a GitHub Release, prove the image works as a</text>
<text x="48" y="251" font-size="15" fill="#e2e8f0" opacity=".92" font-family="Segoe UI,Helvetica,Arial,sans-serif">whole stack in staging, and let anyone redeploy a previous version in…</text>
